version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: task-pipeline-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
    networks:
      - task-pipeline-network

  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: task-pipeline-api-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - task-pipeline-network

  worker-service:
    build:
      context: ./backend/worker-service
      dockerfile: Dockerfile
    container_name: task-pipeline-worker-01
    restart: unless-stopped
    environment:
      - WORKER_ID=worker-01
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - task-pipeline-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: task-pipeline-dashboard
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - api-gateway
    networks:
      - task-pipeline-network

volumes:
  redis_data:
    driver: local

networks:
  task-pipeline-network:
    driver: bridge
